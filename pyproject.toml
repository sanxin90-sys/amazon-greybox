[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon_graybox"
version = "1.0.0"
description = "Physics-guided neural corrections (gray-box ODE-nets) of energy-balance models for near-surface air temperature in Amazonian forests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "torch>=2.3",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["amazon_graybox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
